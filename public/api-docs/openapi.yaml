openapi: 3.0.0
info:
  title: Express API Starter Kit
  version: 1.1.0
  description: API documentation for Express API starter kit
servers:
  - url: http://localhost:4000/v1
    description: Local development server
  - url: https://sandbox.api.yourdomain.com/v1
    description: Sandbox environment
  - url: https://api.yourdomain.com/v1
    description: Production environment

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: API endpoints for managing Authentication
  - name: Users
    description: API endpoints for managing users

paths:
  /register:
    post:
      summary: Register a new user
      description: Create a new user with email and password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - confirmPassword
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Pas$word123
                confirmPassword:
                  type: string
                  format: password
                  example: Pas$word123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 64e72f3bb6dc7b001f2a8c12
                  name:
                    type: string
                    example: John Doe
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR...
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: Validation failed!
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: email is not allowed to be empty
                        password:
                          type: string
                          example: password is not allowed to be empty
                        confirmPassword:
                          type: string
                          example: Passwords must match
  /login:
    post:
      summary: Login user
      description: Authenticate user using email and password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Pas$word123
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: logged in successfully
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: Validation failed!
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: email is not allowed to be empty
                        password:
                          type: string
                          example: password is not allowed to be empty
  /users:
    get:
      summary: Get all users
      description: Retrieve a list of users, optionally filtered.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
          description: Filter users by status
        - in: query
          name: page
          schema:
            type: integer
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
          description: Number of results per page
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: Users list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 64e72f3bb6dc7b001f2a8c12
                        name:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: john@example.com
                        status:
                          type: string
                          example: active
        '401':
          description: Unauthorized - Invalid or missing token
    post:
      summary: Create a new user
      description: Create a user account with name, email, and status.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - status
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  example: active
                profile:
                  type: string
                  format: binary
                  description: Profile image upload (optional)
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      status:
                        type: string
                        example: active
        '401':
          description: Unauthorized - missing or invalid token
  /users/{id}:
    get:
      summary: Get a user by ID
      description: Retrieve a single user by their unique ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to retrieve
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User fetched successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      status:
                        type: string
                        example: active
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: User not found
    put:
      summary: Update a user
      description: Update a user's name, email, and status by ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - status
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  example: active
                profile:
                  type: string
                  format: binary
                  description: Profile image upload (optional)
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      status:
                        type: string
                        example: inactive
        '401':
          description: Unauthorized - missing or invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: User not found
    delete:
      summary: Delete a user
      description: Delete a user by their unique ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User deleted successfully
        '401':
          description: Unauthorized - missing or invalid token
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: User not found
